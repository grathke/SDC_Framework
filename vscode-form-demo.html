<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VS Code Form Demo</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #fffdf8;
      --text: #2d2a26;
      --muted: #6e655c;
      --accent: #1f7a8c;
      --accent-2: #bf4342;
      --border: #e5ddd2;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, #fff7e6 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, #e8f3f6 0%, transparent 35%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      letter-spacing: 0.02em;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    input[type="text"],
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    .checks {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      background: #efe9df;
      color: var(--text);
    }

    .result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed var(--border);
      background: #fff;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      min-height: 72px;
    }

    .note {
      margin-top: 12px;
      color: var(--accent-2);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Interactive Form Demo</h1>
    <p>All three controls are visible at the same time on one form.</p>

    <form id="demoForm" class="grid">
      <div class="field">
        <label for="name">1) Text Input</label>
        <input id="name" name="name" type="text" placeholder="Type your name" />
      </div>

      <div class="field">
        <label for="environment">2) Single Select</label>
        <select id="environment" name="environment">
          <option value="">Choose one</option>
          <option>Development</option>
          <option>Testing</option>
          <option>Production</option>
        </select>
      </div>

      <div class="field">
        <label>3) Multi Select Checkboxes</label>
        <div class="checks">
          <label class="check"><input type="checkbox" name="features" value="Logging" /> Logging</label>
          <label class="check"><input type="checkbox" name="features" value="Audit" /> Audit</label>
          <label class="check"><input type="checkbox" name="features" value="Notifications" /> Notifications</label>
        </div>
      </div>

      <div class="actions">
        <button class="primary" type="submit">Show Values</button>
        <button class="secondary" type="reset">Clear</button>
      </div>
    </form>

    <div id="result" class="result">Submit the form to see captured values.</div>
    <div class="note">This is a local HTML demo for VS Code preview, not a WinForms runtime window.</div>
  </main>

  <script>
    const form = document.getElementById("demoForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = document.getElementById("name").value.trim() || "(empty)";
      const environment = document.getElementById("environment").value || "(none)";
      const features = Array.from(document.querySelectorAll('input[name="features"]:checked'))
        .map((c) => c.value);

      result.textContent =
        "name: " + name + "\n" +
        "environment: " + environment + "\n" +
        "features: " + (features.length ? features.join(", ") : "(none)");
    });

    form.addEventListener("reset", () => {
      setTimeout(() => {
        result.textContent = "Submit the form to see captured values.";
      }, 0);
    });
  </script>
</body>
</html>
